services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animalfacts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animalfacts"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_CONNECTION_STRING: "Host=db;Port=5432;Database=animalfacts;Username=postgres;Password=postgres;Gss Encryption Mode=Disable"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
